services:
  api-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${API_DB_NAME:-canumpe_academic_api}
      POSTGRES_USER: ${API_DB_USER:-academic_api}
      POSTGRES_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
    volumes:
      - api-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${API_DB_USER:-academic_api}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ${IMAGE:-ghcr.io/OWNER/canumpe-academic-api}:${TAG:-latest}
    env_file: .env
    depends_on:
      api-db:
        condition: service_healthy
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    restart: "no"

  api:
    image: ${IMAGE:-ghcr.io/OWNER/canumpe-academic-api}:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  api-db-data:
