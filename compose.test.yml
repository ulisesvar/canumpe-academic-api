services:
  test-api-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: canumpe_academic_api_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-attendance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asistencia_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5434:5432"
    volumes:
      - ./tests/fixtures/attendance_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./tests/fixtures/attendance_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      timeout: 3s
      retries: 20
